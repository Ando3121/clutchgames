name: NBA Daily Digest

on:
  schedule:
    - cron: "0 22-23,0-8 * * *"   # hourly, ~6pm-4am ET (covers NBA game hours across EST/EDT)
  workflow_dispatch:
    inputs:
      target_date:
        description: "Override date to fetch (YYYY-MM-DD), for testing/backfill. Leave blank for normal 'today+yesterday ET' behavior."
        required: false
        type: string

permissions:
  contents: write   # needed so the workflow can commit updated docs/data/ files back to the repo

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python nba_digest_website.py
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          TARGET_DATE: ${{ inputs.target_date }}

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update NBA digest data"
            git push
          fi
