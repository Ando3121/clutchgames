<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClutchGames — Spoiler-Free NBA Digest</title>
<meta name="description" content="Last night's NBA games, ranked by how close they were. Scores stay sealed until you choose to reveal them.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Libre+Franklin:ital,wght@0,400;0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* ── Design tokens ─────────────────────────────────────────────────── */
  :root {
    color-scheme: light dark;
    --ground:    #171310;
    --surface:   #221D17;
    --surface-2: #2B241C;
    --ink:       #F3EDE3;
    --ink-dim:   #A89A87;
    --line:      #3A3226;
    --accent:    #C89B3C;
    --accent-ink: #171310;
    --accent-2:  #6FA88A;
    --meter-off: #3A3226;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --ground:    #F6F1E7;
      --surface:   #FFFCF6;
      --surface-2: #FBF5E9;
      --ink:       #221D17;
      --ink-dim:   #8A7C68;
      --line:      #E4D9C4;
      --accent:    #A87B22;
      --accent-ink: #FFFCF6;
      --accent-2:  #3F6E56;
      --meter-off: #E4D9C4;
    }
  }
  :root[data-theme="dark"] {
    --ground: #171310; --surface: #221D17; --surface-2: #2B241C;
    --ink: #F3EDE3; --ink-dim: #A89A87; --line: #3A3226;
    --accent: #C89B3C; --accent-ink: #171310; --accent-2: #6FA88A; --meter-off: #3A3226;
  }
  :root[data-theme="light"] {
    --ground: #F6F1E7; --surface: #FFFCF6; --surface-2: #FBF5E9;
    --ink: #221D17; --ink-dim: #8A7C68; --line: #E4D9C4;
    --accent: #A87B22; --accent-ink: #FFFCF6; --accent-2: #3F6E56; --meter-off: #E4D9C4;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "Libre Franklin", sans-serif;
    overflow-x: hidden;
  }
  body { -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  main {
    max-width: 780px;
    margin: 0 auto;
    padding: 40px 20px 72px;
  }

  /* ── Header / marquee ─────────────────────────────────────────────── */
  header { margin-bottom: 32px; }
  .wordmark {
    font-family: "Big Shoulders Display", sans-serif;
    font-weight: 900;
    font-size: clamp(2.4rem, 9vw, 3.2rem);
    line-height: 0.9;
    letter-spacing: 0.01em;
    margin: 0;
    color: var(--ink);
  }
  .wordmark .clutch { color: var(--accent); }
  .eyebrow {
    font-family: "Libre Franklin", sans-serif;
    font-weight: 600;
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 6px;
  }
  .tagline {
    font-family: "Libre Franklin", sans-serif;
    font-style: italic;
    font-weight: 500;
    color: var(--ink-dim);
    font-size: 0.95rem;
    margin: 10px 0 0;
  }
  .marquee-rule {
    height: 3px;
    margin-top: 18px;
    background: repeating-linear-gradient(
      90deg, var(--accent) 0 14px, transparent 14px 22px
    );
  }

  .date-picker {
    margin-top: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .date-picker label {
    font-family: "Libre Franklin", sans-serif;
    font-weight: 600;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .date-picker select {
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 7px 10px;
    font-family: "Libre Franklin", sans-serif;
    font-weight: 500;
    font-size: 0.9rem;
  }

  /* ── Closeness meter (scoreboard LED bars) ───────────────────────── */
  .meter {
    display: flex;
    gap: 3px;
    align-items: flex-end;
    height: 16px;
    flex: none;
  }
  .meter .seg {
    width: 5px;
    border-radius: 1px;
    background: var(--meter-off);
  }
  .meter .seg.on { background: var(--accent); }
  .meter .seg:nth-child(1) { height: 40%; }
  .meter .seg:nth-child(2) { height: 55%; }
  .meter .seg:nth-child(3) { height: 70%; }
  .meter .seg:nth-child(4) { height: 85%; }
  .meter .seg:nth-child(5) { height: 100%; }

  .rating-label {
    font-family: "Libre Franklin", sans-serif;
    font-weight: 600;
    font-size: 0.82rem;
    color: var(--ink-dim);
    white-space: nowrap;
  }

  /* ── Controls row: sort toggle + reveal-all ───────────────────────── */
  .controls-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin: 32px 0 14px;
  }
  .sort-toggle {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
  }
  .sort-btn {
    appearance: none;
    margin: 0;
    border: none;
    background: var(--surface);
    color: var(--ink-dim);
    font-family: "Libre Franklin", sans-serif;
    font-weight: 600;
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    padding: 7px 12px;
    cursor: pointer;
  }
  .sort-btn + .sort-btn { border-left: 1px solid var(--line); }
  .sort-btn.active { background: var(--accent); color: var(--accent-ink); }

  .reveal-all-btn {
    appearance: none;
    margin: 0;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 6px;
    font-family: "Libre Franklin", sans-serif;
    font-weight: 600;
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    padding: 8px 14px;
    cursor: pointer;
  }
  .reveal-all-btn:hover { background: var(--accent); color: var(--accent-ink); }
  .reveal-all-btn.active { background: var(--accent); color: var(--accent-ink); }

  /* ── Games table ───────────────────────────────────────────────────── */
  .table-scroll {
    overflow-x: auto;
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  table.games-table {
    width: 100%;
    border-collapse: collapse;
    background: var(--surface);
  }
  .games-table th {
    text-align: left;
    font-family: "Libre Franklin", sans-serif;
    font-weight: 600;
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-dim);
    padding: 10px 14px;
    border-bottom: 2px solid var(--accent);
    white-space: nowrap;
  }
  .games-table td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
  }
  .games-table tbody tr:last-child td { border-bottom: none; }
  .games-table tbody tr:nth-child(even) { background: var(--surface-2); }

  .team-cell {
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  .team-cell .logo { width: 24px; height: 24px; object-fit: contain; flex: none; }
  .team-cell .team-name {
    font-family: "Big Shoulders Display", sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.01em;
  }
  .at-cell {
    color: var(--ink-dim);
    font-family: "Libre Franklin", sans-serif;
    font-size: 0.8rem;
    text-align: center;
    width: 1%;
  }
  .closeness-cell { min-width: 150px; }
  .closeness-inner { display: flex; align-items: center; gap: 10px; }

  .score-cell { text-align: right; }
  .reveal-btn {
    appearance: none;
    margin: 0;
    background: transparent;
    border: 1px dashed var(--line);
    color: var(--ink-dim);
    border-radius: 5px;
    font-family: "Libre Franklin", sans-serif;
    font-weight: 600;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 6px 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .reveal-btn:hover { border-color: var(--accent); color: var(--accent); }
  .reveal-btn.revealed {
    border-style: solid;
    border-color: var(--line);
    color: var(--ink);
    font-family: "IBM Plex Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-size: 0.88rem;
    text-transform: none;
    letter-spacing: 0;
    cursor: default;
  }
  .reveal-btn.revealed:hover { border-color: var(--line); color: var(--ink); }
  .reveal-btn .win { color: var(--accent-2); font-weight: 700; }
  .reveal-btn .dash { color: var(--ink-dim); margin: 0 5px; }

  /* ── Status / empty states ────────────────────────────────────────── */
  .status-msg {
    color: var(--ink-dim);
    text-align: center;
    padding: 48px 0;
    font-family: "Libre Franklin", sans-serif;
  }
  .status-msg.error { color: var(--accent); }

  /* ── Ad slot ───────────────────────────────────────────────────────── */
  .ad-slot {
    margin: 28px 0;
    min-height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    border: 1px dashed var(--line);
    border-radius: 6px;
    color: var(--ink-dim);
    font-family: "Libre Franklin", sans-serif;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  footer {
    text-align: center;
    color: var(--ink-dim);
    font-family: "Libre Franklin", sans-serif;
    font-size: 0.8rem;
    margin-top: 44px;
  }
</style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow">Spoiler-Free Digest</p>
    <h1 class="wordmark">Clutch<span class="clutch">Games</span></h1>
    <p class="tagline" id="subtitle">Last night's slate, ranked by closeness — sealed until you look.</p>
    <div class="marquee-rule" aria-hidden="true"></div>
    <div class="date-picker" id="date-picker" style="display:none;">
      <label for="date-select">Date</label>
      <select id="date-select"></select>
    </div>
  </header>

  <div class="ad-slot" id="ad-slot-top">Advertisement</div>

  <p class="status-msg" id="status">Loading games…</p>

  <div id="games-wrap" style="display:none;">
    <div class="controls-row">
      <div class="sort-toggle" role="group" aria-label="Sort games by">
        <button class="sort-btn active" type="button" data-sort="time">Kickoff order</button>
        <button class="sort-btn" type="button" data-sort="closeness">Closeness</button>
      </div>
      <button class="reveal-all-btn" type="button" id="reveal-all">Show all scores</button>
    </div>
    <div class="table-scroll">
      <table class="games-table">
        <thead>
          <tr>
            <th scope="col">Away</th>
            <th scope="col"></th>
            <th scope="col">Home</th>
            <th scope="col">Closeness</th>
            <th scope="col">Score</th>
          </tr>
        </thead>
        <tbody id="games-tbody"></tbody>
      </table>
    </div>
  </div>

  <footer>
    Scores stay sealed until you reveal them.
  </footer>
</main>

<script src="app.js"></script>
</body>
</html>
